# Static front + reverse proxy to the API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/css image/svg+xml application/geo+json;
  gzip_min_length 1024;

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Baked data (DEM, airspace, static atlas fallback): revalidate daily.
  location /data/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
