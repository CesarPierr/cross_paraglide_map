# Static front + reverse proxy to the API, on two ports:
# - 80 (published as HTTP_PORT, the local network): open;
# - 81 (published as PUBLIC_PORT, the one to forward from the router): HTTP basic
#   authentication (users in /etc/nginx/htpasswd, created by deploy/install.sh),
#   no moderation API, and a request rate limit per address.
server_tokens off;
limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  include /etc/nginx/snippets/site.inc;
}

server {
  listen 81;
  server_name _;
  auth_basic "Brises des Alpes";
  auth_basic_user_file /etc/nginx/htpasswd;
  limit_req zone=public burst=80 nodelay;

  # Moderation stays on the local network.
  location /api/admin/ {
    return 404;
  }

  include /etc/nginx/snippets/site.inc;
}
